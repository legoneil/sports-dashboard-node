<!DOCTYPE html>
<html>
<head>
  <title>Sports Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <!-- Standard favicon -->
<link rel="icon" type="image/png" href="logo.png">

<!-- iOS home screen icon -->
<link rel="apple-touch-icon" href="logo.png">

<!-- Android / Chrome PWA -->
<link rel="manifest" href="manifest.json">

</head>
<body>
  <h1>Sports Dashboard</h1>

  <div class="section">
    <h2>NFL Scores</h2>
    <div id="nfl"></div>
  </div>

  <div class="section">
    <h2>NBA Scores</h2>
    <div id="nba"></div>

  <div class="section">
    <h2>College Football Scores</h2>
    <div id="cfb"></div>
  </div>
  <div class="mobile-layout">
    <h1 class="mobile-title">Scores</h1>
    <div id="games-mobile"></div>
  </div>

  <script src="app.js"></script>

</html>
